# SockOS 데스크톱 화면 설정
[core]
idle-time=0
require-input=false

[shell]
background-image=/usr/share/sockos/wallpaper.png
background-type=scale-crop
background-color=0xff2d1b4e
panel-color=0xee1a1028
panel-position=top
clock-format=minutes
locking=false

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

[launcher]
icon=/usr/share/sockos/browser.png
path=/usr/bin/falkon

[launcher]
icon=/usr/share/sockos/video.png
path=/usr/bin/falkon https://www.youtube.com
